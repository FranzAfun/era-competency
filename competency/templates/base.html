<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ERA AXIS{% endblock %}</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-bg': '#0F172A',
                        'brand-card': '#1E293B',
                        'brand-border': 'rgba(148, 163, 184, 0.28)',
                        'brand-primary': '#39366F',
                        'brand-primary-hover': '#4A468A',
                        'brand-error': '#EF4444',
                        'brand-text-muted': '#94A3B8',
                    },
                    fontFamily: {
                        'sans': ['Inter', 'sans-serif'],
                        'heading': ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    borderRadius: {
                        'brand': '10px',
                        'brand-input': '8px',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-brand-bg text-white font-sans min-h-screen flex items-center justify-center;
            }
            h1, h2, h3, h4, h5, h6 {
                @apply font-heading;
            }
        }

        @layer utilities {
            .btn-loading-spinner {
                width: 1rem;
                height: 1rem;
                border: 2px solid rgba(255, 255, 255, 0.35);
                border-top-color: #ffffff;
                border-radius: 9999px;
                display: inline-block;
                animation: button-spin 0.8s linear infinite;
            }
        }

        @keyframes button-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body class="bg-brand-bg">
    <div class="container mx-auto px-4 py-8 flex items-center justify-center min-h-screen">
        {% block content %}{% endblock %}
    </div>

    <script>
        (function () {
            const forms = document.querySelectorAll('form');

            forms.forEach((form) => {
                form.addEventListener('submit', function (event) {
                    const submitter = event.submitter || form.querySelector('button[type="submit"], input[type="submit"]');
                    if (!submitter || submitter.dataset.loadingApplied === '1') {
                        return;
                    }

                    // Add hidden input with the button's name/value so it's sent even if disabled
                    if (submitter.name) {
                        const hiddenInput = document.createElement('input');
                        hiddenInput.type = 'hidden';
                        hiddenInput.name = submitter.name;
                        hiddenInput.value = submitter.value;
                        form.appendChild(hiddenInput);
                    }

                    submitter.dataset.loadingApplied = '1';
                    submitter.disabled = true;

                    if (submitter.tagName.toLowerCase() === 'button') {
                        const customLoadingText = submitter.getAttribute('data-loading-text');
                        const loadingLabel = customLoadingText || 'Loading';

                        submitter.innerHTML = '<span class="btn-loading-spinner" aria-hidden="true"></span><span>' + loadingLabel + '</span>';
                        submitter.classList.add('opacity-90', 'cursor-not-allowed');
                    } else {
                        submitter.value = 'Loading';
                    }
                });
            });
        })();
    </script>
</body>
</html>
