{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ERA AXIS{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        (function () {
            const storageKey = 'era-axis-theme';
            const storedTheme = localStorage.getItem(storageKey);
            const resolvedTheme = storedTheme === 'light' || storedTheme === 'dark'
                ? storedTheme
                : 'light';

            document.documentElement.setAttribute('data-theme', resolvedTheme);
        })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-canvas': 'rgb(var(--brand-canvas-rgb) / <alpha-value>)',
                        'brand-bg': 'rgb(var(--brand-bg-rgb) / <alpha-value>)',
                        'brand-card': 'rgb(var(--brand-card-rgb) / <alpha-value>)',
                        'brand-border': 'rgb(var(--brand-border-rgb) / <alpha-value>)',
                        'brand-primary': 'rgb(var(--brand-primary-rgb) / <alpha-value>)',
                        'brand-primary-hover': 'rgb(var(--brand-primary-hover-rgb) / <alpha-value>)',
                        'brand-error': 'rgb(var(--brand-error-rgb) / <alpha-value>)',
                        'brand-error-soft': 'rgb(var(--brand-error-soft-rgb) / <alpha-value>)',
                        'brand-success': 'rgb(var(--brand-success-rgb) / <alpha-value>)',
                        'brand-success-soft': 'rgb(var(--brand-success-soft-rgb) / <alpha-value>)',
                        'brand-warning': 'rgb(var(--brand-warning-rgb) / <alpha-value>)',
                        'brand-warning-soft': 'rgb(var(--brand-warning-soft-rgb) / <alpha-value>)',
                        'brand-overlay': 'rgb(var(--brand-overlay-rgb) / <alpha-value>)',
                        'brand-text': 'rgb(var(--brand-text-rgb) / <alpha-value>)',
                        'brand-text-muted': 'rgb(var(--brand-muted-rgb) / <alpha-value>)',
                    },
                    fontFamily: {
                        'sans': ['Inter', 'sans-serif'],
                        'heading': ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    borderRadius: {
                        'brand': '10px',
                        'brand-input': '8px',
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer base {
            :root {
                --brand-canvas-rgb: 15 23 42;
                --brand-bg-rgb: 17 26 45;
                --brand-card-rgb: 30 41 59;
                --brand-border-rgb: 148 163 184;
                --brand-primary-rgb: 57 54 111;
                --brand-primary-hover-rgb: 74 70 138;
                --brand-error-rgb: 248 113 113;
                --brand-error-soft-rgb: 127 29 29;
                --brand-danger-fill-rgb: 185 28 28;
                --brand-danger-fill-hover-rgb: 220 38 38;
                --brand-danger-surface-rgb: 56 25 33;
                --brand-danger-surface-hover-rgb: 74 31 41;
                --brand-danger-border-rgb: 248 113 113;
                --brand-success-rgb: 52 211 153;
                --brand-success-soft-rgb: 6 78 59;
                --brand-warning-rgb: 251 191 36;
                --brand-warning-soft-rgb: 113 63 18;
                --brand-overlay-rgb: 2 6 23;
                --brand-text-rgb: 248 250 252;
                --brand-muted-rgb: 148 163 184;
                --brand-card-shadow: 0 18px 38px rgba(2, 6, 23, 0.34), 0 6px 16px rgba(2, 6, 23, 0.2);
                --brand-soft-shadow: 0 12px 28px rgba(2, 6, 23, 0.18);
                --brand-button-shadow: 0 12px 24px rgba(57, 54, 111, 0.28);
                --brand-button-shadow-hover: 0 16px 32px rgba(57, 54, 111, 0.34);
                --brand-danger-shadow: 0 10px 24px rgba(220, 38, 38, 0.18);
                --brand-toggle-shadow: 0 10px 24px rgba(2, 6, 23, 0.16);
            }

            html {
                color-scheme: dark;
            }

            html[data-theme="light"] {
                color-scheme: light;
                --brand-canvas-rgb: 246 242 234;
                --brand-bg-rgb: 236 231 221;
                --brand-card-rgb: 252 248 241;
                --brand-border-rgb: 121 137 163;
                --brand-primary-rgb: 69 66 133;
                --brand-primary-hover-rgb: 55 52 107;
                --brand-error-rgb: 220 38 38;
                --brand-error-soft-rgb: 254 226 226;
                --brand-danger-fill-rgb: 220 38 38;
                --brand-danger-fill-hover-rgb: 185 28 28;
                --brand-danger-surface-rgb: 254 226 226;
                --brand-danger-surface-hover-rgb: 254 205 211;
                --brand-danger-border-rgb: 220 38 38;
                --brand-success-rgb: 4 120 87;
                --brand-success-soft-rgb: 209 250 229;
                --brand-warning-rgb: 180 83 9;
                --brand-warning-soft-rgb: 254 243 199;
                --brand-overlay-rgb: 39 47 64;
                --brand-text-rgb: 24 33 52;
                --brand-muted-rgb: 92 107 132;
                --brand-card-shadow: 0 20px 42px rgba(24, 33, 52, 0.08), 0 8px 18px rgba(24, 33, 52, 0.05);
                --brand-soft-shadow: 0 14px 28px rgba(24, 33, 52, 0.08);
                --brand-button-shadow: 0 12px 24px rgba(69, 66, 133, 0.16);
                --brand-button-shadow-hover: 0 16px 32px rgba(69, 66, 133, 0.22);
                --brand-danger-shadow: 0 10px 24px rgba(220, 38, 38, 0.12);
                --brand-toggle-shadow: 0 10px 24px rgba(24, 33, 52, 0.08);
            }

            body {
                @apply bg-brand-canvas text-brand-text font-sans min-h-screen flex flex-col antialiased;
                background-image:
                    radial-gradient(circle at top left, rgb(var(--brand-primary-rgb) / 0.12), transparent 28%),
                    radial-gradient(circle at top right, rgb(var(--brand-success-rgb) / 0.08), transparent 22%),
                    linear-gradient(180deg, rgb(var(--brand-canvas-rgb)) 0%, rgb(var(--brand-canvas-rgb)) 100%);
                background-attachment: fixed;
            }
            h1, h2, h3, h4, h5, h6 {
                @apply font-heading text-brand-text;
            }
            a, button {
                transition-property: color, background-color, border-color, box-shadow, transform, opacity;
                transition-duration: 200ms;
                transition-timing-function: ease;
            }
            input, textarea, select {
                color: rgb(var(--brand-text-rgb));
            }
            input::placeholder,
            textarea::placeholder {
                color: rgb(var(--brand-muted-rgb) / 0.62);
            }
            select option,
            select optgroup {
                background-color: rgb(var(--brand-card-rgb));
                color: rgb(var(--brand-text-rgb));
            }
            ::selection {
                background-color: rgb(var(--brand-primary-rgb) / 0.24);
                color: rgb(var(--brand-text-rgb));
            }
        }

        @layer components {
            .brand-panel {
                @apply rounded-brand border border-brand-border bg-brand-card ring-1 ring-brand-border/50;
                box-shadow: var(--brand-card-shadow);
            }

            .brand-stat-card {
                @apply rounded-brand border border-brand-border bg-brand-card;
                box-shadow: var(--brand-soft-shadow);
            }

            .brand-primary-button {
                @apply inline-flex items-center justify-center gap-2 bg-brand-primary text-white;
                box-shadow: var(--brand-button-shadow);
            }

            .brand-primary-button:hover {
                background-color: rgb(var(--brand-primary-hover-rgb));
                box-shadow: var(--brand-button-shadow-hover);
            }

            .brand-primary-button:focus-visible,
            .brand-secondary-button:focus-visible,
            .brand-danger-button:focus-visible,
            .brand-danger-outline-button:focus-visible,
            .brand-input:focus,
            .brand-select:focus,
            .brand-textarea:focus,
            .brand-file-input:focus {
                @apply ring-4 ring-brand-primary/15;
            }

            .brand-secondary-button {
                @apply inline-flex items-center justify-center gap-2 border border-brand-border bg-brand-card/40 text-brand-text-muted;
            }

            .brand-secondary-button:hover {
                @apply border-brand-text-muted bg-brand-card/75 text-brand-text;
            }

            .brand-danger-button {
                @apply inline-flex items-center justify-center gap-2 border text-white;
                border-color: rgb(var(--brand-danger-border-rgb) / 0.22);
                background-color: rgb(var(--brand-danger-fill-rgb));
                box-shadow: none;
            }

            .brand-danger-button:hover {
                background-color: rgb(var(--brand-danger-fill-hover-rgb));
                border-color: rgb(var(--brand-danger-border-rgb) / 0.3);
            }

            .brand-danger-outline-button {
                @apply inline-flex items-center justify-center gap-2;
                border-color: rgb(var(--brand-danger-border-rgb) / 0.34);
                background-color: rgb(var(--brand-danger-surface-rgb) / 0.34);
                color: rgb(var(--brand-error-rgb));
            }

            .brand-danger-outline-button:hover {
                border-color: rgb(var(--brand-danger-border-rgb) / 0.52);
                background-color: rgb(var(--brand-danger-surface-hover-rgb) / 0.52);
                color: rgb(var(--brand-text-rgb));
            }

            .brand-danger-outline-button:disabled {
                @apply cursor-not-allowed border-brand-border/70 bg-brand-bg text-brand-text-muted opacity-100;
            }

            .brand-button-disabled {
                @apply inline-flex items-center justify-center gap-2 border border-brand-border/80 bg-brand-bg text-brand-text-muted cursor-not-allowed;
                box-shadow: none;
            }

            .brand-primary-button:disabled,
            .brand-danger-button:disabled {
                @apply border border-brand-border bg-brand-bg text-brand-text-muted cursor-not-allowed;
                box-shadow: none;
            }

            .brand-input,
            .brand-select,
            .brand-textarea,
            .brand-file-input {
                @apply border border-brand-border bg-brand-bg text-brand-text outline-none;
                box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.04);
            }

            .brand-input:hover,
            .brand-select:hover,
            .brand-textarea:hover,
            .brand-file-input:hover {
                @apply border-brand-text-muted/70;
            }

            .brand-input:focus,
            .brand-select:focus,
            .brand-textarea:focus,
            .brand-file-input:focus {
                @apply border-brand-primary;
            }

            .brand-select {
                @apply cursor-pointer;
            }

            .brand-file-input {
                color: rgb(var(--brand-muted-rgb));
            }

            .brand-file-input::file-selector-button {
                margin-right: 0.75rem;
                border: 0;
                border-radius: 0.5rem;
                background-color: rgb(var(--brand-card-rgb));
                color: rgb(var(--brand-text-rgb));
                padding: 0.65rem 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: background-color 200ms ease, color 200ms ease, transform 200ms ease;
            }

            .brand-file-input:hover::file-selector-button {
                background-color: rgb(var(--brand-primary-rgb) / 0.12);
            }

            .brand-modal-overlay {
                @apply fixed inset-0 z-50 hidden items-center justify-center bg-brand-overlay/55 backdrop-blur-[1px] px-4;
            }

            .brand-modal-panel {
                @apply w-full max-w-md rounded-brand border border-brand-border bg-brand-card p-6;
                box-shadow: var(--brand-card-shadow);
            }

            .brand-modal-panel-danger {
                border-color: rgb(var(--brand-danger-border-rgb) / 0.28);
                background-color: rgb(var(--brand-card-rgb));
            }

            .brand-table-head {
                @apply border-b border-brand-border text-brand-text-muted;
            }

            .brand-table-row {
                @apply border-b border-brand-border/50 text-brand-text-muted;
            }

            .brand-callout-success {
                @apply rounded-brand-input border border-brand-success/25 bg-brand-success-soft/55 text-brand-success;
            }

            .brand-callout-danger {
                border-color: rgb(var(--brand-danger-border-rgb) / 0.32);
                background: linear-gradient(180deg, rgb(var(--brand-danger-surface-rgb) / 0.58), rgb(var(--brand-danger-surface-rgb) / 0.42));
                color: rgb(var(--brand-error-rgb));
                @apply rounded-brand-input;
            }

            .brand-callout-warning {
                @apply rounded-brand-input border border-brand-warning/30 bg-brand-warning-soft/65 text-brand-warning;
            }

            .theme-toggle {
                @apply inline-flex items-center gap-3 rounded-full border border-brand-border bg-brand-card/90 px-4 py-2 text-sm font-medium text-brand-text backdrop-blur;
                box-shadow: var(--brand-toggle-shadow);
            }

            .theme-toggle:hover {
                @apply border-brand-text-muted/70 bg-brand-card;
                transform: translateY(-1px);
            }

            .theme-toggle__icon {
                @apply h-4 w-4 text-brand-primary;
            }

            html[data-theme="light"] [data-theme-icon="light"] {
                display: inline;
            }

            html[data-theme="light"] [data-theme-icon="dark"] {
                display: none;
            }

            html[data-theme="dark"] [data-theme-icon="light"] {
                display: none;
            }
        }

        @layer utilities {
            .btn-loading-spinner {
                width: 1rem;
                height: 1rem;
                border: 2px solid rgba(255, 255, 255, 0.35);
                border-top-color: #ffffff;
                border-radius: 9999px;
                display: inline-block;
                animation: button-spin 0.8s linear infinite;
            }
        }

        @keyframes button-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="flex min-h-screen flex-col bg-brand-canvas">
    <div class="pointer-events-none fixed inset-x-0 top-0 z-40">
        <div class="mx-auto flex max-w-7xl justify-end px-4 py-4">
            <button type="button" class="theme-toggle pointer-events-auto" data-theme-toggle aria-label="Toggle theme">
                <svg data-theme-icon="light" class="theme-toggle__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2.75V5.25"></path>
                    <path d="M12 18.75V21.25"></path>
                    <path d="M4.93 4.93L6.7 6.7"></path>
                    <path d="M17.3 17.3L19.07 19.07"></path>
                    <path d="M2.75 12H5.25"></path>
                    <path d="M18.75 12H21.25"></path>
                    <path d="M4.93 19.07L6.7 17.3"></path>
                    <path d="M17.3 6.7L19.07 4.93"></path>
                </svg>
                <svg data-theme-icon="dark" class="theme-toggle__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z"></path>
                </svg>
                <span data-theme-label>Theme</span>
            </button>
        </div>
    </div>

    <main class="container mx-auto flex flex-1 items-center justify-center px-4 pb-8 pt-24 sm:pt-28">
        {% block content %}{% endblock %}
    </main>

    <footer class="w-full border-t border-brand-border/60 bg-brand-card/55 text-center text-sm text-brand-text-muted backdrop-blur-sm">
        <div class="mx-auto max-w-7xl px-4 py-4">
            ERA AXIS Competency © 2026 · Developed by ERA Technologies
        </div>
    </footer>

    <script>
        (function () {
            const storageKey = 'era-axis-theme';
            const root = document.documentElement;
            const toggleButton = document.querySelector('[data-theme-toggle]');
            const toggleLabel = document.querySelector('[data-theme-label]');

            function applyTheme(theme, persistTheme) {
                root.setAttribute('data-theme', theme);

                if (toggleButton) {
                    toggleButton.setAttribute('aria-pressed', theme === 'light' ? 'true' : 'false');
                    toggleButton.setAttribute('aria-label', 'Switch to ' + (theme === 'dark' ? 'light' : 'dark') + ' mode');
                }

                if (toggleLabel) {
                    toggleLabel.textContent = theme === 'dark' ? 'Dark mode' : 'Light mode';
                }

                if (persistTheme) {
                    localStorage.setItem(storageKey, theme);
                }
            }

            if (toggleButton) {
                toggleButton.addEventListener('click', function () {
                    const nextTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                    applyTheme(nextTheme, true);
                });
            }

            applyTheme(root.getAttribute('data-theme') || 'light', false);

            const forms = document.querySelectorAll('form');

            forms.forEach((form) => {
                form.addEventListener('submit', function (event) {
                    const submitter = event.submitter || form.querySelector('button[type="submit"], input[type="submit"]');
                    if (!submitter || submitter.dataset.loadingApplied === '1') {
                        return;
                    }

                    if (submitter.name) {
                        const hiddenInput = document.createElement('input');
                        hiddenInput.type = 'hidden';
                        hiddenInput.name = submitter.name;
                        hiddenInput.value = submitter.value;
                        form.appendChild(hiddenInput);
                    }

                    submitter.dataset.loadingApplied = '1';
                    submitter.disabled = true;

                    if (submitter.tagName.toLowerCase() === 'button') {
                        const customLoadingText = submitter.getAttribute('data-loading-text');
                        const loadingLabel = customLoadingText || 'Loading';

                        submitter.innerHTML = '<span class="btn-loading-spinner" aria-hidden="true"></span><span>' + loadingLabel + '</span>';
                        submitter.classList.add('opacity-90', 'cursor-not-allowed');
                    } else {
                        submitter.value = 'Loading';
                    }
                });
            });
        })();
    </script>
</body>
</html>
