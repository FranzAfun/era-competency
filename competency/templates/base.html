<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ERA AXIS{% endblock %}</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-bg': '#0F172A',
                        'brand-card': '#1E293B',
                        'brand-border': 'rgba(148, 163, 184, 0.28)',
                        'brand-primary': '#39366F',
                        'brand-primary-hover': '#4A468A',
                        'brand-error': '#EF4444',
                        'brand-text-muted': '#94A3B8',
                    },
                    fontFamily: {
                        'sans': ['Inter', 'sans-serif'],
                        'heading': ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    borderRadius: {
                        'brand': '10px',
                        'brand-input': '8px',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-brand-bg text-white font-sans min-h-screen flex items-center justify-center;
            }
            h1, h2, h3, h4, h5, h6 {
                @apply font-heading;
            }
        }
    </style>
</head>
<body class="bg-brand-bg">
    <div class="container mx-auto px-4 py-8 flex items-center justify-center min-h-screen">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
