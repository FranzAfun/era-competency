{% extends "base.html" %}

{% block title %}Admin Portal Login - ERA AXIS{% endblock %}

{% block content %}
<div class="w-full max-w-md mx-auto">
    <div class="text-center mb-8">
        <h2 class="text-brand-text text-lg font-bold tracking-widest uppercase mb-4">ERA AXIS</h2>
        <h1 class="text-brand-text text-2xl font-semibold">Admin Portal</h1>
    </div>

    <div class="brand-panel p-6">
        {% if messages %}
            <div class="space-y-2 mb-5">
                {% for message in messages %}
                    <p class="text-sm {% if message.tags == 'error' %}text-brand-error{% else %}text-brand-success{% endif %}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div class="space-y-2">
                <label for="id_username" class="block text-sm font-medium text-brand-text-muted">Username</label>
                <input type="text" name="username" id="id_username" required class="brand-input w-full rounded-brand-input px-4 py-3" placeholder="Admin username">
            </div>

            <div class="space-y-2">
                <label for="id_password" class="block text-sm font-medium text-brand-text-muted">Password</label>
                <input type="password" name="password" id="id_password" required class="brand-input w-full rounded-brand-input px-4 py-3" placeholder="Admin password">
            </div>

            <button type="submit" class="brand-primary-button w-full rounded-brand-input px-6 py-4 font-bold uppercase">
                Login to Admin Portal
            </button>
        </form>
    </div>
</div>
{% endblock %}
