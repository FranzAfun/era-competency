{% extends "base.html" %}

{% block title %}Admin Portal Login - ERA AXIS{% endblock %}

{% block content %}
<div class="w-full max-w-md mx-auto">
    <div class="text-center mb-8">
        <h2 class="text-white text-lg font-bold tracking-widest uppercase mb-4">ERA AXIS</h2>
        <h1 class="text-white text-2xl font-semibold">Admin Portal</h1>
    </div>

    <div class="bg-brand-card rounded-brand p-6 border border-brand-border ring-1 ring-brand-border/50 shadow-[0_8px_20px_rgba(2,6,23,0.35),0_2px_6px_rgba(2,6,23,0.22)]">
        {% if messages %}
            <div class="space-y-2 mb-5">
                {% for message in messages %}
                    <p class="text-sm {% if message.tags == 'error' %}text-brand-error{% else %}text-emerald-300{% endif %}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div class="space-y-2">
                <label for="id_username" class="block text-sm font-medium text-brand-text-muted">Username</label>
                <input type="text" name="username" id="id_username" required class="w-full bg-brand-bg border border-brand-border rounded-brand-input px-4 py-3 text-white placeholder-brand-text-muted/50 focus:border-brand-primary focus:ring-4 focus:ring-brand-primary/20 transition-all outline-none" placeholder="Admin username">
            </div>

            <div class="space-y-2">
                <label for="id_password" class="block text-sm font-medium text-brand-text-muted">Password</label>
                <input type="password" name="password" id="id_password" required class="w-full bg-brand-bg border border-brand-border rounded-brand-input px-4 py-3 text-white placeholder-brand-text-muted/50 focus:border-brand-primary focus:ring-4 focus:ring-brand-primary/20 transition-all outline-none" placeholder="Admin password">
            </div>

            <button type="submit" class="w-full bg-brand-primary hover:bg-brand-primary-hover hover:-translate-y-0.5 hover:shadow-lg text-white font-bold py-4 px-6 rounded-brand-input transition-all duration-200 uppercase">
                Login to Admin Portal
            </button>
        </form>
    </div>
</div>
{% endblock %}
